name: aws-down

# Derruba o ambiente efemero na AWS (ADR 0019): helm uninstall dos servicos e do db-init, terraform destroy do
# envs/aws e conferencia do que sobrou (infra/aws/leftovers.sh, que so lista: falha o job se sobrou algo).
# O chart sai antes do destroy: com o controller de pe, os TargetGroupBinding saem e o ALB e as ENIs nao ficam presos.
# Manual (workflow_dispatch) ou chamado pelo aws-reaper (workflow_call). So da main.
# Configuracao do repositorio: vars.AWS_ROLE_ARN, vars.TF_STATE_BUCKET e vars.COGNITO_DOMAIN_PREFIX (ver aws-up.yml).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: sa-east-1
  TF_DIR: infra/terraform/envs/aws
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  NAMESPACE: digitalbanking

jobs:
  down:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Mesmo grupo do aws-up: um aws-down chamado pelo aws-reaper espera uma subida em andamento terminar.
    concurrency:
      group: aws-environment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Conferir a configuracao do repositorio
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
        run: |
          missing=()
          for name in AWS_ROLE_ARN TF_STATE_BUCKET COGNITO_DOMAIN_PREFIX; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configuracao ausente no repositorio: ${missing[*]}" >&2
            exit 1
          fi

      - uses: ./.github/actions/aws-tools

      - name: Credenciais da AWS (OIDC) para os charts
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-down-${{ github.run_id }}

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir="$TF_DIR" init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=envs/aws/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      # vpc_id fica guardado para o leftovers.sh conferir ENIs depois do destroy. created_at nao tem padrao e e
      # obrigatoria ate no destroy: usa a do estado (ou o agora, se o estado estiver vazio).
      - name: Ler o estado
        run: |
          created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$(terraform -chdir="$TF_DIR" state list)" ]; then
            created_at=$(terraform -chdir="$TF_DIR" output -raw created_at 2> /dev/null || echo "$created_at")
            echo "CLUSTER_NAME=$(terraform -chdir="$TF_DIR" output -raw cluster_name 2> /dev/null || true)" >> "$GITHUB_ENV"
            echo "VPC_ID=$(terraform -chdir="$TF_DIR" output -raw vpc_id 2> /dev/null || true)" >> "$GITHUB_ENV"
          else
            echo "estado vazio: nada a derrubar pelo Terraform"
          fi
          echo "TF_VAR_created_at=$created_at" >> "$GITHUB_ENV"

      # Servicos primeiro (os TargetGroupBinding saem com o controller ainda de pe), depois o db-init. O Job do
      # db-init e hook do Helm e continua no cluster depois do uninstall: sai aqui, explicitamente.
      - name: helm uninstall dos servicos e do db-init
        if: ${{ env.CLUSTER_NAME != '' }}
        run: |
          if ! aws eks describe-cluster --region "$AWS_REGION" --name "$CLUSTER_NAME" > /dev/null 2>&1; then
            echo "cluster $CLUSTER_NAME nao existe: nada a desinstalar"
            exit 0
          fi
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          for release in statement notification transfers accounts customer db-init; do
            if helm status "$release" -n "$NAMESPACE" > /dev/null 2>&1; then
              helm uninstall "$release" -n "$NAMESPACE" --wait --timeout 10m
            else
              echo "release $release nao instalado"
            fi
          done
          kubectl -n "$NAMESPACE" delete job db-init --ignore-not-found --wait=true
          # Sem TargetGroupBinding restante: o controller ja tirou os alvos e o destroy leva os target groups.
          for _ in $(seq 1 30); do
            left=$(kubectl get targetgroupbindings.elbv2.k8s.aws -A --no-headers 2> /dev/null || true)
            [ -n "$left" ] || break
            echo "aguardando TargetGroupBinding sair: $left"
            sleep 10
          done
          if [ -n "$left" ]; then
            echo "TargetGroupBinding ainda presentes: $left" >&2
            exit 1
          fi

      - name: Credenciais da AWS (OIDC) para o destroy
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-down-destroy-${{ github.run_id }}

      - name: Terraform destroy
        env:
          TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
        run: terraform -chdir="$TF_DIR" destroy -auto-approve

      - name: Credenciais da AWS (OIDC) para a conferencia
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: aws-down-leftovers-${{ github.run_id }}

      # So lista (Tagging API e ENIs da VPC); sobrou algo -> o job falha com a lista.
      - name: Conferir o que sobrou
        run: infra/aws/leftovers.sh "${VPC_ID:-}"

      - name: Resumo
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## aws-down"
            echo "- created-at do ambiente: \`${TF_VAR_created_at:-?}\`"
            echo "- resultado: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
