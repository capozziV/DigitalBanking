name: CI

on:
  push:
    branches: [main]
  pull_request:

# Num PR, um push novo cancela a execucao anterior do mesmo PR. Na main, cada commit tem o proprio grupo (pelo sha):
# nada e cancelado nem descartado da fila, e todo commit da main fica com o ci-ok dele.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide, pelos caminhos alterados, quais jobs rodam. `shared` cobre tudo que afeta todos os servicos.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
      transfers: ${{ steps.filter.outputs.transfers }}
      notification: ${{ steps.filter.outputs.notification }}
      statement: ${{ steps.filter.outputs.statement }}
      customer: ${{ steps.filter.outputs.customer }}
      shared: ${{ steps.filter.outputs.shared }}
      e2e: ${{ steps.filter.outputs.e2e }}
      terraform: ${{ steps.filter.outputs.terraform }}
      helm: ${{ steps.filter.outputs.helm }}
      aws: ${{ steps.filter.outputs.aws }}
      lint: ${{ steps.filter.outputs.lint }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            accounts:
              - 'services/accounts/**'
              - 'services/customer/bootstrap/src/contractTest/**'
            transfers:
              - 'services/transfers/**'
              - 'services/accounts/bootstrap/src/contractTest/**'
              - 'services/customer/bootstrap/src/contractTest/**'
            notification:
              - 'services/notification/**'
            statement:
              - 'services/statement/**'
            customer:
              - 'services/customer/**'
            e2e:
              - 'tests/e2e/**'
            terraform:
              - 'infra/terraform/**'
            helm:
              - 'deploy/helm/**'
            aws:
              - 'infra/aws/**'
              - '.github/actions/**'
            lint:
              - 'api/bruno/**'
            images:
              - 'services/*/Dockerfile'
              - 'services/*/.dockerignore'
            shared:
              - 'libs/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'infra/local/**'
              - '.github/workflows/**'

  accounts:
    needs: changes
    if: ${{ needs.changes.outputs.accounts == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build do accounts (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: >
          ./gradlew
          :services:accounts:domain:build
          :services:accounts:application:build
          :services:accounts:adapters:build
          :services:accounts:bootstrap:build
      - name: Publicar o jar do accounts para o smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-accounts
          path: services/accounts/bootstrap/build/libs/accounts.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-accounts
          path: 'services/accounts/**/build/reports/tests/'

  transfers:
    needs: changes
    if: ${{ needs.changes.outputs.transfers == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build do transfers (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por modulo de services/transfers/, para um modulo novo entrar sem editar o workflow.
          tasks=()
          for dir in services/transfers/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              tasks+=(":services:transfers:$(basename "$dir"):build")
            fi
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar o jar do transfers para o smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-transfers
          path: services/transfers/bootstrap/build/libs/transfers.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-transfers
          path: 'services/transfers/**/build/reports/tests/'

  notification:
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build do notification (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por modulo de services/notification/, para um modulo novo entrar sem editar o workflow.
          tasks=()
          for dir in services/notification/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              tasks+=(":services:notification:$(basename "$dir"):build")
            fi
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar o jar do notification para o smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-notification
          path: services/notification/bootstrap/build/libs/notification.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-notification
          path: 'services/notification/**/build/reports/tests/'

  statement:
    needs: changes
    if: ${{ needs.changes.outputs.statement == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build do statement (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por modulo de services/statement/, para um modulo novo entrar sem editar o workflow.
          tasks=()
          for dir in services/statement/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              tasks+=(":services:statement:$(basename "$dir"):build")
            fi
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar o jar do statement para o smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-statement
          path: services/statement/bootstrap/build/libs/statement.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-statement
          path: 'services/statement/**/build/reports/tests/'

  customer:
    needs: changes
    if: ${{ needs.changes.outputs.customer == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build do customer (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por modulo de services/customer/, para um modulo novo entrar sem editar o workflow.
          tasks=()
          for dir in services/customer/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              tasks+=(":services:customer:$(basename "$dir"):build")
            fi
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar o jar do customer para o smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-customer
          path: services/customer/bootstrap/build/libs/customer.jar
          if-no-files-found: error
          retention-days: 1
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-customer
          path: 'services/customer/**/build/reports/tests/'

  libs:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build das bibliotecas compartilhadas
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por diretorio de libs/, para uma lib nova entrar sem editar o workflow.
          tasks=()
          for dir in libs/*/; do
            tasks+=(":libs:$(basename "$dir"):build")
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-libs
          path: 'libs/**/build/reports/tests/'

  # Imagem Docker de cada servico (services/<servico>/Dockerfile), etiquetada com o SHA do commit, a partir do jar
  # que o job de build publicou (a imagem nao compila). As cinco vao num artifact para o smoke subir o perfil apps.
  images:
    # Pulado (nao falho) conta como sucesso nos `needs`; `!failure()` deixa as imagens saírem quando
    # algum job de build foi pulado pelo filtro de caminhos (o jar dele e gerado aqui).
    needs: [changes, accounts, transfers, notification, statement, customer]
    if: >-
      ${{ !failure() && !cancelled() &&
      (needs.changes.outputs.accounts == 'true' ||
      needs.changes.outputs.transfers == 'true' ||
      needs.changes.outputs.notification == 'true' ||
      needs.changes.outputs.statement == 'true' ||
      needs.changes.outputs.customer == 'true' ||
      needs.changes.outputs.images == 'true' ||
      needs.changes.outputs.shared == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Os jars que os jobs de build desta execucao publicaram (jar-<servico>, um por servico que rodou).
      - name: Baixar os jars dos jobs de build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars
      # Servico pulado pelo filtro de caminhos nao publica jar; so esses sao gerados aqui.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Gerar os jars que faltam
        run: |
          mkdir -p jars
          missing=()
          for service in customer accounts transfers notification statement; do
            if [ ! -f "jars/$service.jar" ]; then
              missing+=("$service")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "os cinco jars vieram dos jobs de build"
            exit 0
          fi
          echo "gerando: ${missing[*]}"
          tasks=()
          for service in "${missing[@]}"; do
            tasks+=(":services:$service:bootstrap:bootJar")
          done
          ./gradlew "${tasks[@]}"
          for service in "${missing[@]}"; do
            cp "services/$service/bootstrap/build/libs/$service.jar" jars/
          done
      # O contexto de cada imagem e services/<servico>, que espera o jar em bootstrap/build/libs/<servico>.jar.
      - name: Construir as cinco imagens
        run: |
          for service in customer accounts transfers notification statement; do
            mkdir -p "services/$service/bootstrap/build/libs"
            cp "jars/$service.jar" "services/$service/bootstrap/build/libs/$service.jar"
            docker build -t "digitalbanking/$service:$IMAGE_TAG" "services/$service"
          done
      - name: Conferir que nenhuma imagem roda como root
        run: |
          for service in customer accounts transfers notification statement; do
            uid=$(docker run --rm --entrypoint id "digitalbanking/$service:$IMAGE_TAG" -u)
            echo "$service: uid $uid"
            if [ "$uid" = 0 ]; then
              echo "a imagem do $service roda como root" >&2
              exit 1
            fi
          done
      - name: Exportar as imagens
        run: |
          images=()
          for service in customer accounts transfers notification statement; do
            images+=("digitalbanking/$service:$IMAGE_TAG")
          done
          docker save "${images[@]}" | gzip -1 > images.tar.gz
          ls -lh images.tar.gz
      - name: Publicar as imagens para o smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Smoke contra o perfil apps do compose: os cinco servicos pelas imagens do job images, mais a infra local.
  smoke:
    needs: [changes, images, libs]
    # Pulado (nao falho) conta como sucesso nos `needs`; `!failure()` deixa o smoke rodar quando o libs foi pulado.
    # Imagens puladas nao: sem elas nao ha o que subir, e o `if` abaixo e o mesmo do job images.
    if: >-
      ${{ !failure() && !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ github.sha }}
      # Os conteineres aceitam o iss http://mock-oauth2-server:8080/default; o mock monta o iss pelo Host pedido.
      MOCK_OAUTH2_HOST: mock-oauth2-server:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Baixar as imagens do job images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: Carregar as imagens
        run: gunzip -c images.tar.gz | docker load
      - name: Subir a infra local e os cinco servicos pelas imagens (perfil apps)
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "segredo LOCALSTACK_AUTH_TOKEN ausente" >&2
            exit 1
          fi
          docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yml --profile apps \
            up --wait --no-build --wait-timeout 600
      - name: Health dos cinco servicos via nginx
        run: |
          for route in customers accounts transfers notifications statement; do
            body=$(curl -fsS "http://127.0.0.1/$route/actuator/health")
            echo "$route: $body"
            grep -q '"status":"UP"' <<< "$body"
          done
      - name: Seed do usuario de teste do dono (duas vezes, comparadas, para provar a idempotencia)
        run: bash infra/local/seed-check.sh http://127.0.0.1 1000000
      - name: Operacoes via nginx com tokens e eventos na fila de inspecao do LocalStack
        run: bash infra/local/smoke.sh http://127.0.0.1
      - name: Diagnostico em caso de falha (saude e logs dos conteineres, servicos inclusos)
        if: failure()
        run: |
          compose=(docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yml --profile apps)
          echo "::group::conteineres e State.Health"
          "${compose[@]}" ps -a || true
          for container in $("${compose[@]}" ps -aq); do
            docker inspect --format '{{.Name}} {{.State.Status}} {{json .State.Health}}' "$container" || true
          done
          echo "::endgroup::"
          echo "::group::logs dos conteineres"
          "${compose[@]}" logs --no-color --timestamps || true
          echo "::endgroup::"
      - name: Derrubar a infra local
        if: always()
        run: docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yml --profile apps down -v

  # Lint do proprio CI e dos scripts: actionlint (com shellcheck nos blocos run), shellcheck nos scripts de
  # infra/local e a copia do script das colecoes Bruno. Binarios oficiais com versao e sha256 fixos.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' || needs.changes.outputs.aws == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: '0.11.0'
      # sha256 do shellcheck-v0.11.0.linux.x86_64.tar.xz (o release nao publica arquivo de checksums).
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: '1.7.12'
      # Do actionlint_1.7.12_checksums.txt do release.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar shellcheck e actionlint
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION/shellcheck" "$bin/"
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      - name: actionlint (shellcheck nos blocos run)
        run: |
          shellcheck --version
          actionlint -version
          actionlint -color
      - name: shellcheck nos scripts de infra/local e infra/aws
        run: find infra/local infra/aws -name '*.sh' -print0 | xargs -0 shellcheck
      # O Bruno nao compartilha scripts entre colecoes: estas quatro copias tem de ficar iguais.
      - name: Script das colecoes Bruno igual nas quatro copias
        run: |
          for collection in notification statement transfers; do
            cmp api/bruno/accounts/collection.bru "api/bruno/$collection/collection.bru"
          done

  # Testes ponta a ponta: accounts, transfers, notification, statement e customer como processos (java -jar), PostgreSQL, Redis,
  # LocalStack e mock-oauth2-server por Testcontainers. Roda quando muda qualquer servico, o proprio e2e ou o que afeta todos (`shared`).
  e2e:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.accounts == 'true' ||
      needs.changes.outputs.transfers == 'true' ||
      needs.changes.outputs.notification == 'true' ||
      needs.changes.outputs.statement == 'true' ||
      needs.changes.outputs.customer == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    # Acima do timeout de 20 min do integrationTest do e2e mais a compilacao dos cinco jars.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Testes ponta a ponta (gera os cinco jars e sobe os processos)
        env:
          # Sem o segredo, o teste falha no CI em vez de ser pulado.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: ./gradlew :tests:e2e:build
      - name: Publicar relatorios e logs dos processos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-e2e
          path: |
            tests/e2e/build/reports/tests/
            tests/e2e/build/e2e-logs/

  # Terraform so valida (sem credenciais da AWS e sem apply). bootstrap: fmt, init sem backend, validate, tflint e a
  # trust policy. envs/aws: fmt, init sem backend, validate, tflint na raiz e nos modulos e as conferencias contra o
  # nginx, o LocalStack e os charts (check-*.py). Tudo pelos validate.sh, os mesmos que rodam na maquina.
  terraform:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.terraform == 'true' ||
      needs.changes.outputs.helm == 'true' ||
      needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # tflint --init baixa o plugin aws do GitHub; com o token, sem limite de chamadas anonimas.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: bootstrap (fmt, init sem backend, validate, tflint, trust policy)
        run: infra/terraform/bootstrap/validate.sh
      - name: envs/aws (fmt, init sem backend, validate, tflint, conferencias)
        run: infra/terraform/envs/aws/validate.sh

  # Chart Helm sem cluster: deploy/helm/validate.sh (lint, template, kubeconform -strict e regras do projeto) e o
  # render do deploy-services.sh com saidas ficticias do Terraform. A versao do Kubernetes do kubeconform vem do
  # kubernetes_version do Terraform (kubernetes-version.sh), fonte unica.
  helm:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.helm == 'true' ||
      needs.changes.outputs.terraform == 'true' ||
      needs.changes.outputs.aws == 'true' ||
      needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: '0.8.0'
      # Do CHECKSUMS do release v0.8.0 (kubeconform-linux-amd64.tar.gz).
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.22.1'
      - name: Instalar o kubeconform
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$bin" kubeconform
          echo "$bin" >> "$GITHUB_PATH"
      - name: Versao do Kubernetes do Terraform
        run: echo "KUBERNETES_VERSION=$(infra/terraform/envs/aws/kubernetes-version.sh)" >> "$GITHUB_ENV"
      - name: deploy/helm/validate.sh
        run: |
          echo "kubeconform na versao $KUBERNETES_VERSION"
          deploy/helm/validate.sh
      - name: Render do deploy-services.sh (db-init e servicos a partir das saidas do Terraform)
        run: infra/aws/deploy-services.test.sh

  # Scripts do ambiente na AWS testados sem AWS (shell puro, com aws falso no PATH): decisao do aws-reaper
  # (8 h, etiqueta ausente, malformada, fuso), a leitura das etiquetas e a conferencia de sobras do aws-down.
  aws-scripts:
    needs: changes
    if: ${{ needs.changes.outputs.aws == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: reaper-decision.sh
        run: infra/aws/reaper-decision.test.sh
      - name: reaper-check.sh
        run: infra/aws/reaper-check.test.sh
      - name: leftovers.sh
        run: infra/aws/leftovers.test.sh
      - name: helm-teardown.sh
        run: infra/aws/helm-teardown.test.sh

  # Check unico exigido pela protecao da main: falha se algum job falhou ou foi cancelado;
  # job pulado pelo filtro de caminhos conta como sucesso.
  ci-ok:
    needs: [changes, accounts, transfers, notification, statement, customer, libs, images, smoke, e2e, terraform, helm, aws-scripts, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o resultado dos jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "algum job falhou ou foi cancelado" >&2
              exit 1
            fi
          done
