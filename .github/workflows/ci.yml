name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide, pelos caminhos alterados, quais jobs rodam. `shared` cobre tudo que afeta todos os servicos.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
      transfers: ${{ steps.filter.outputs.transfers }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            accounts:
              - 'services/accounts/**'
            transfers:
              - 'services/transfers/**'
            shared:
              - 'libs/**'
              - 'build-logic/**'
              - 'gradle/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'infra/local/**'
              - '.github/workflows/**'

  accounts:
    needs: changes
    if: ${{ needs.changes.outputs.accounts == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build do accounts (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: >
          ./gradlew
          :services:accounts:domain:build
          :services:accounts:application:build
          :services:accounts:adapters:build
          :services:accounts:bootstrap:build
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-accounts
          path: 'services/accounts/**/build/reports/tests/'

  transfers:
    needs: changes
    if: ${{ needs.changes.outputs.transfers == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build do transfers (compile, ktlint, testes, ArchUnit, integracao)
        env:
          # Testes com LocalStack; sem o segredo, falham no CI em vez de serem pulados.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por modulo de services/transfers/, para um modulo novo entrar sem editar o workflow.
          tasks=()
          for dir in services/transfers/*/; do
            if [ -f "${dir}build.gradle.kts" ]; then
              tasks+=(":services:transfers:$(basename "$dir"):build")
            fi
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-transfers
          path: 'services/transfers/**/build/reports/tests/'

  libs:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build das bibliotecas compartilhadas
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Uma tarefa por diretorio de libs/, para uma lib nova entrar sem editar o workflow.
          tasks=()
          for dir in libs/*/; do
            tasks+=(":libs:$(basename "$dir"):build")
          done
          ./gradlew "${tasks[@]}"
      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-libs
          path: 'libs/**/build/reports/tests/'

  smoke:
    # Pulado (nao falho) conta como sucesso nos `needs`; `!failure()` deixa o smoke rodar quando
    # o accounts, o transfers ou o libs foram pulados.
    needs: [changes, accounts, transfers, libs]
    if: >-
      ${{ !failure() && !cancelled() &&
      (needs.changes.outputs.accounts == 'true' ||
      needs.changes.outputs.transfers == 'true' ||
      needs.changes.outputs.shared == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Gerar o jar executavel
        run: ./gradlew :services:accounts:bootstrap:bootJar
      - name: Subir a infra local (PostgreSQL, Redis, nginx, LocalStack)
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "segredo LOCALSTACK_AUTH_TOKEN ausente" >&2
            exit 1
          fi
          docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yml up --wait
      - name: Subir o servico accounts
        run: |
          set -a
          . infra/local/.env.example
          set +a
          java -jar services/accounts/bootstrap/build/libs/bootstrap.jar > accounts.log 2>&1 &
      - name: Health via nginx
        run: |
          for _ in $(seq 1 60); do
            if body=$(curl -fsS http://127.0.0.1/accounts/actuator/health) && echo "$body" | grep -q '"status":"UP"'; then
              echo "$body"
              exit 0
            fi
            sleep 1
          done
          echo "health nao ficou UP em 60 s" >&2
          exit 1
      - name: Operacoes via nginx e eventos na fila de inspecao do LocalStack
        run: bash infra/local/smoke.sh http://127.0.0.1
      - name: Log do servico e do LocalStack em caso de falha
        if: failure()
        run: |
          cat accounts.log || true
          docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yml logs localstack || true
      - name: Derrubar a infra local
        if: always()
        run: docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.yml down -v

  # Check unico exigido pela protecao da main: falha se algum job falhou ou foi cancelado;
  # job pulado pelo filtro de caminhos conta como sucesso.
  ci-ok:
    needs: [changes, accounts, transfers, libs, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o resultado dos jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "algum job falhou ou foi cancelado" >&2
              exit 1
            fi
          done
