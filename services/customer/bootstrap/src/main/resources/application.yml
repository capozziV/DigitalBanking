spring:
  application:
    name: customer
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer}
    username: ${CUSTOMER_DB_USER:customer_app}
    password: ${CUSTOMER_DB_PASSWORD:customer_app}
  flyway:
    user: ${CUSTOMER_DB_OWNER_USER:customer_owner}
    password: ${CUSTOMER_DB_OWNER_PASSWORD:customer_owner}
    placeholders:
      appUser: ${CUSTOMER_DB_USER:customer_app}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CUSTOMER_JWT_ISSUER_URI:http://localhost:8090/default}

digitalbanking:
  observability:
    # OTLP/HTTP endpoint of the collector, for traces, metrics and logs. Exports are asynchronous, in batches with a
    # bounded queue that drops when full: a collector that is down never fails nor slows a request.
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}
  security:
    # "groups" in the mock server, "cognito:groups" in Cognito.
    groups-claim: ${CUSTOMER_JWT_GROUPS_CLAIM:groups}

customer:
  outbox:
    relay-enabled: true
    poll-interval: 500ms
    batch-size: 100
    alert-after-attempts: 10
    publish-timeout: 2s
    max-cycle-duration: 10s
    retry-backoff: 1s
    max-retry-backoff: 30s
  aws:
    # LocalStack by default; an empty CUSTOMER_AWS_ENDPOINT uses the real AWS endpoint and credential chain.
    endpoint: ${CUSTOMER_AWS_ENDPOINT:http://localhost:4566}
    region: ${CUSTOMER_AWS_REGION:us-east-1}
    topic-arn: ${CUSTOMER_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:customer-events.fifo}

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) on stdout; the MDC goes in as fields: traceId and spanId (Micrometer Tracing) and
      # correlationId (libs/observabilidade). The same lines also go out by OTLP.
      console: ecs

server:
  port: 8085

management:
  tracing:
    sampling:
      # Every request is traced, locally and on AWS: the volume is a demo's.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${digitalbanking.observability.otlp-endpoint}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${digitalbanking.observability.otlp-endpoint}/v1/logs
  otlp:
    metrics:
      export:
        url: ${digitalbanking.observability.otlp-endpoint}/v1/metrics
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
