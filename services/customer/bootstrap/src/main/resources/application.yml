spring:
  application:
    name: customer
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer}
    username: ${CUSTOMER_DB_USER:customer_app}
    password: ${CUSTOMER_DB_PASSWORD:customer_app}
  flyway:
    user: ${CUSTOMER_DB_OWNER_USER:customer_owner}
    password: ${CUSTOMER_DB_OWNER_PASSWORD:customer_owner}
    placeholders:
      appUser: ${CUSTOMER_DB_USER:customer_app}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CUSTOMER_JWT_ISSUER_URI:http://localhost:8090/default}

digitalbanking:
  security:
    # "groups" in the mock server, "cognito:groups" in Cognito.
    groups-claim: ${CUSTOMER_JWT_GROUPS_CLAIM:groups}

customer:
  outbox:
    relay-enabled: true
    poll-interval: 500ms
    batch-size: 100
    alert-after-attempts: 10
    publish-timeout: 2s
    max-cycle-duration: 10s
    retry-backoff: 1s
    max-retry-backoff: 30s
  aws:
    # LocalStack by default; an empty CUSTOMER_AWS_ENDPOINT uses the real AWS endpoint and credential chain.
    endpoint: ${CUSTOMER_AWS_ENDPOINT:http://localhost:4566}
    region: ${CUSTOMER_AWS_REGION:us-east-1}
    topic-arn: ${CUSTOMER_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:customer-events.fifo}

logging:
  pattern:
    # Correlation id of the request (MDC key of OutboxEventEnvelope.CORRELATION_ID_MDC_KEY) on every log line.
    correlation: "[%X{correlationId:-}] "

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
