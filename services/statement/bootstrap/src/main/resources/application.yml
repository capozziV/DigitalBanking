server:
  port: 8084

spring:
  application:
    name: statement
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${STATEMENT_JWT_ISSUER_URI:http://localhost:8090/default}
  cloud:
    aws:
      # Like the outbox relays and notification: a blank endpoint is the real AWS endpoint of the region with the AWS
      # default credential chain; an endpoint (LocalStack) comes with static test credentials
      # (AwsCredentialsConfiguration). The local environment (infra/local/.env) and the tests set the LocalStack
      # endpoint explicitly.
      region:
        static: ${STATEMENT_AWS_REGION:us-east-1}
      sqs:
        endpoint: ${STATEMENT_AWS_ENDPOINT:}
  data:
    redis:
      host: ${STATEMENT_REDIS_HOST:localhost}
      port: ${STATEMENT_REDIS_PORT:6379}
      # With Redis down a command fails fast and the statement is read from DynamoDB (RedisStatementFirstPageCache).
      timeout: ${STATEMENT_CACHE_TIMEOUT:100ms}
      connect-timeout: ${STATEMENT_CACHE_TIMEOUT:100ms}

digitalbanking:
  observability:
    # OTLP/HTTP endpoint of the collector, for traces, metrics and logs. Exports are asynchronous, in batches with a
    # bounded queue that drops when full: a collector that is down never fails nor slows a request.
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}
  security:
    # Claim of the token that lists the user's groups ("admin" makes an admin); cognito:groups on AWS.
    groups-claim: ${STATEMENT_JWT_GROUPS_CLAIM:groups}

statement:
  cache:
    # false swaps the Redis cache for a no-op one.
    enabled: ${STATEMENT_CACHE_ENABLED:true}
    ttl: 60s
    ttl-jitter: 10s
  dynamodb:
    # Its own endpoint, apart from the SQS one: DynamoDB Local in the local environment, blank on AWS
    # (DynamoDbConfiguration).
    endpoint: ${STATEMENT_DYNAMODB_ENDPOINT:}
    table: ${STATEMENT_TABLE:statement}
  queues:
    accounts: ${STATEMENT_ACCOUNTS_QUEUE:statement-accounts.fifo}
    accounts-dlq: ${STATEMENT_ACCOUNTS_DLQ:statement-accounts-dlq.fifo}
  dlq-metrics:
    # How often the DLQ depth gauge reads SQS (a scrape only reads the last value).
    refresh-interval: ${STATEMENT_DLQ_METRICS_REFRESH:30s}

management:
  tracing:
    sampling:
      # Every request is traced, locally and on AWS: the volume is a demo's.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${digitalbanking.observability.otlp-endpoint}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${digitalbanking.observability.otlp-endpoint}/v1/logs
  otlp:
    metrics:
      export:
        url: ${digitalbanking.observability.otlp-endpoint}/v1/metrics
        step: 10s
  endpoint:
    health:
      # Only an admin sees the details; /actuator/health itself stays open (liveness for compose and the load balancer).
      show-details: when-authorized
      roles: ADMIN
  health:
    redis:
      # The cache is optional: a Redis outage must not turn the service DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        # The DLQ depth gauge is read from /actuator/metrics (admin only).
        include: health,metrics

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) on stdout; the MDC goes in as fields: traceId and spanId (Micrometer Tracing) and
      # correlationId (libs/observabilidade). The same lines also go out by OTLP.
      console: ecs
