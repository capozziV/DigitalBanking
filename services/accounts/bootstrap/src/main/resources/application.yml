spring:
  application:
    name: accounts
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACCOUNTS_DB_URL:jdbc:postgresql://localhost:5432/accounts}
    username: ${ACCOUNTS_DB_USER:accounts_app}
    password: ${ACCOUNTS_DB_PASSWORD:accounts_app}
  jackson:
    mapper:
      # Amounts are numbers: "1500" must be rejected, never coerced from a string.
      allow-coercion-of-scalars: false
    deserialization:
      # Amounts are whole cents: 1.5 must be rejected, never truncated to 1.
      accept-float-as-int: false
  flyway:
    user: ${ACCOUNTS_DB_OWNER_USER:accounts_owner}
    password: ${ACCOUNTS_DB_OWNER_PASSWORD:accounts_owner}
    placeholders:
      appUser: ${ACCOUNTS_DB_USER:accounts_app}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ACCOUNTS_JWT_ISSUER_URI:http://localhost:8090/default}

digitalbanking:
  security:
    groups-claim: ${ACCOUNTS_JWT_GROUPS_CLAIM:groups}
    # Machine token (client credentials) for the calls to the customer service.
    service-token:
      token-uri: ${ACCOUNTS_OAUTH_TOKEN_URI:http://localhost:8090/default/token}
      client-id: ${ACCOUNTS_OAUTH_CLIENT_ID:accounts}
      client-secret: ${ACCOUNTS_OAUTH_CLIENT_SECRET:local-secret}

accounts:
  lock-timeout: 2s
  customer:
    # Asked on every account opening (GET /internal/customers/{id}); slower than the timeout is 503.
    base-url: ${ACCOUNTS_CUSTOMER_BASE_URL:http://localhost:8085}
    timeout: ${ACCOUNTS_CUSTOMER_TIMEOUT:500ms}
  outbox:
    relay-enabled: true
    poll-interval: 500ms
    batch-size: 100
    alert-after-attempts: 10
    publish-timeout: 2s
    max-cycle-duration: 10s
    retry-backoff: 1s
    max-retry-backoff: 30s
  aws:
    # LocalStack by default; an empty ACCOUNTS_AWS_ENDPOINT uses the real AWS endpoint and credential chain.
    endpoint: ${ACCOUNTS_AWS_ENDPOINT:http://localhost:4566}
    region: ${ACCOUNTS_AWS_REGION:us-east-1}
    topic-arn: ${ACCOUNTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:accounts-events.fifo}

logging:
  pattern:
    # Correlation id of the request (MDC key of OutboxEventEnvelope.CORRELATION_ID_MDC_KEY) on every log line.
    correlation: "[%X{correlationId:-}] "

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      # Health is open; its details and components are shown to admins only (the rest of /actuator is admin only).
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
