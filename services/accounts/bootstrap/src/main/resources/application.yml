spring:
  application:
    name: accounts
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACCOUNTS_DB_URL:jdbc:postgresql://localhost:5432/accounts}
    username: ${ACCOUNTS_DB_USER:accounts_app}
    password: ${ACCOUNTS_DB_PASSWORD:accounts_app}
  flyway:
    user: ${ACCOUNTS_DB_OWNER_USER:accounts_owner}
    password: ${ACCOUNTS_DB_OWNER_PASSWORD:accounts_owner}
    placeholders:
      appUser: ${ACCOUNTS_DB_USER:accounts_app}

accounts:
  lock-timeout: 2s

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
