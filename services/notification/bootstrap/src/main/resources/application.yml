server:
  port: 8083

spring:
  application:
    name: notification
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USER:notification_app}
    password: ${NOTIFICATION_DB_PASSWORD:notification_app}
  flyway:
    user: ${NOTIFICATION_DB_OWNER_USER:notification_owner}
    password: ${NOTIFICATION_DB_OWNER_PASSWORD:notification_owner}
    placeholders:
      appUser: ${NOTIFICATION_DB_USER:notification_app}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NOTIFICATION_JWT_ISSUER_URI:http://localhost:8090/default}
  cloud:
    aws:
      # Like the outbox relays: a blank endpoint is the real AWS endpoint of the region with the AWS default
      # credential chain; an endpoint (LocalStack) comes with static test credentials (AwsCredentialsConfiguration).
      # The local environment (infra/local/.env) and the tests set the LocalStack endpoint explicitly.
      region:
        static: ${NOTIFICATION_AWS_REGION:us-east-1}
      sqs:
        endpoint: ${NOTIFICATION_AWS_ENDPOINT:}

digitalbanking:
  security:
    # Claim of the token that lists the user's groups ("admin" makes an admin); cognito:groups on AWS.
    groups-claim: ${NOTIFICATION_JWT_GROUPS_CLAIM:groups}

notification:
  queues:
    accounts: ${NOTIFICATION_ACCOUNTS_QUEUE:notification-accounts.fifo}
    transfers: ${NOTIFICATION_TRANSFERS_QUEUE:notification-transfers.fifo}
    accounts-dlq: ${NOTIFICATION_ACCOUNTS_DLQ:notification-accounts-dlq.fifo}
    transfers-dlq: ${NOTIFICATION_TRANSFERS_DLQ:notification-transfers-dlq.fifo}
  dlq-metrics:
    # How often the notification.dlq.messages gauge reads the DLQ depths from SQS (a scrape only reads the last value).
    refresh-interval: ${NOTIFICATION_DLQ_METRICS_REFRESH_INTERVAL:30s}

management:
  endpoint:
    health:
      # Only an admin sees the details; /actuator/health itself stays open (liveness for compose and the load balancer).
      show-details: when-authorized
      roles: ADMIN
  endpoints:
    web:
      exposure:
        # notification.dlq.messages is read from /actuator/metrics (admin only).
        include: health,metrics

logging:
  pattern:
    # Correlation id (MDC key of OutboxEventEnvelope.CORRELATION_ID_MDC_KEY), from the SQS message attribute
    # while an event is consumed.
    correlation: "[%X{correlationId:-}] "
