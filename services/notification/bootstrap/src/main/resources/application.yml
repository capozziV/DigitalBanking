server:
  port: 8083

spring:
  application:
    name: notification
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USER:notification_app}
    password: ${NOTIFICATION_DB_PASSWORD:notification_app}
  flyway:
    user: ${NOTIFICATION_DB_OWNER_USER:notification_owner}
    password: ${NOTIFICATION_DB_OWNER_PASSWORD:notification_owner}
    placeholders:
      appUser: ${NOTIFICATION_DB_USER:notification_app}
  cloud:
    aws:
      # LocalStack and its test credentials by default; the deploy (stage 8) sets the real ones.
      region:
        static: ${NOTIFICATION_AWS_REGION:us-east-1}
      credentials:
        access-key: ${NOTIFICATION_AWS_ACCESS_KEY:test}
        secret-key: ${NOTIFICATION_AWS_SECRET_KEY:test}
      sqs:
        endpoint: ${NOTIFICATION_AWS_ENDPOINT:http://localhost:4566}

notification:
  queues:
    accounts: ${NOTIFICATION_ACCOUNTS_QUEUE:notification-accounts.fifo}
    transfers: ${NOTIFICATION_TRANSFERS_QUEUE:notification-transfers.fifo}
    accounts-dlq: ${NOTIFICATION_ACCOUNTS_DLQ:notification-accounts-dlq.fifo}
    transfers-dlq: ${NOTIFICATION_TRANSFERS_DLQ:notification-transfers-dlq.fifo}

logging:
  pattern:
    # Correlation id (MDC key of OutboxEventEnvelope.CORRELATION_ID_MDC_KEY), from the SQS message attribute
    # while an event is consumed.
    correlation: "[%X{correlationId:-}] "
