events {}

http {
  server {
    listen 80;

    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    # Actuator: o prefixo /accounts sai (/accounts/actuator/health -> /actuator/health).
    location /accounts/actuator/ {
      proxy_pass http://host.docker.internal:8081/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # API: proxy_pass sem caminho preserva a URI (/accounts/... chega ao servico como esta).
    # /accounts exato e /accounts/...; /accountsX nao casa e fica com o 404 do nginx.
    location = /accounts {
      proxy_pass http://host.docker.internal:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /accounts/ {
      proxy_pass http://host.docker.internal:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /admin/account-types {
      proxy_pass http://host.docker.internal:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # transfers (porta 8082): mesmas regras do accounts.
    # Limite diario (GET /accounts/{id}/daily-limit) e do transfers, nao do accounts. A regex vence o prefixo
    # /accounts/ (sem ^~ no prefixo, o nginx avalia as regex e usa a primeira que casa).
    location ~ ^/accounts/[^/]+/daily-limit$ {
      proxy_pass http://host.docker.internal:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /transfers/actuator/ {
      proxy_pass http://host.docker.internal:8082/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location = /transfers {
      proxy_pass http://host.docker.internal:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /transfers/ {
      proxy_pass http://host.docker.internal:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # notification (porta 8083): mesmas regras do accounts.
    location /notifications/actuator/ {
      proxy_pass http://host.docker.internal:8083/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location = /notifications {
      proxy_pass http://host.docker.internal:8083;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /notifications/ {
      proxy_pass http://host.docker.internal:8083;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # statement (porta 8084): GET /accounts/{id}/statement. A regex vence o prefixo /accounts/ do accounts
    # (sem ^~ no prefixo, o nginx avalia as regex e usa a primeira que casa).
    location ~ ^/accounts/[^/]+/statement$ {
      proxy_pass http://host.docker.internal:8084;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /statement/actuator/ {
      proxy_pass http://host.docker.internal:8084/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # customer (porta 8085): POST /customers, GET /customers/me e /admin/customers/**. O /internal/customers fica
    # de fora da borda: so os servicos o chamam, direto e com token de maquina.
    location /customers/actuator/ {
      proxy_pass http://host.docker.internal:8085/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location = /customers {
      proxy_pass http://host.docker.internal:8085;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /customers/ {
      proxy_pass http://host.docker.internal:8085;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /admin/customers/ {
      proxy_pass http://host.docker.internal:8085;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
  }
}
