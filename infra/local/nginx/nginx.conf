events {}

http {
  server {
    listen 80;

    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    # Actuator: o prefixo /accounts sai (/accounts/actuator/health -> /actuator/health).
    location /accounts/actuator/ {
      proxy_pass http://host.docker.internal:8081/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # API: proxy_pass sem caminho preserva a URI (/accounts/... chega ao servico como esta).
    # /accounts exato e /accounts/...; /accountsX nao casa e fica com o 404 do nginx.
    location = /accounts {
      proxy_pass http://host.docker.internal:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /accounts/ {
      proxy_pass http://host.docker.internal:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /admin/account-types {
      proxy_pass http://host.docker.internal:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # transfers (porta 8082): mesmas regras do accounts.
    location /transfers/actuator/ {
      proxy_pass http://host.docker.internal:8082/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location = /transfers {
      proxy_pass http://host.docker.internal:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /transfers/ {
      proxy_pass http://host.docker.internal:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # notification (porta 8083): mesmas regras do accounts.
    location /notifications/actuator/ {
      proxy_pass http://host.docker.internal:8083/actuator/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location = /notifications {
      proxy_pass http://host.docker.internal:8083;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /notifications/ {
      proxy_pass http://host.docker.internal:8083;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
  }
}
