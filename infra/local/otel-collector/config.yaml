# Coletor OpenTelemetry: recebe OTLP dos servicos e repassa traces ao Tempo, metricas ao Prometheus e logs ao Loki.
# Exportacao em lote com fila limitada: backend fora descarta, nao atrasa a requisicao do servico.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 30s
  # O Prometheus recebe OTLP em /api/v1/otlp/v1/metrics (--web.enable-otlp-receiver).
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 30s
  # O Loki recebe OTLP nativo em /otlp/v1/logs.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 30s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
