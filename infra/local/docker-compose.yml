services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ACCOUNTS_DB_OWNER_PASSWORD: ${ACCOUNTS_DB_OWNER_PASSWORD:-accounts_owner}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_app}
      TRANSFERS_DB_OWNER_PASSWORD: ${TRANSFERS_DB_OWNER_PASSWORD:-transfers_owner}
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emulador AWS (SNS e SQS). Exige LOCALSTACK_AUTH_TOKEN (conta Hobby gratuita) no .env.
  # Mesma imagem de LocalStackTestSupport.IMAGE (libs/testing-localstack); mude as duas juntas.
  localstack:
    image: localstack/localstack:2026.10.2
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: sns,sqs
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Saudavel so depois que os scripts de init (topico e fila) terminam com sucesso.
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request as r; s = json.load(r.urlopen('http://127.0.0.1:4566/_localstack/init/ready')); exit(0 if s['completed'] and s['scripts'] and all(x['state'] == 'SUCCESSFUL' for x in s['scripts']) else 1)"
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
