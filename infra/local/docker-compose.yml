services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ACCOUNTS_DB_OWNER_PASSWORD: ${ACCOUNTS_DB_OWNER_PASSWORD:-accounts_owner}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_app}
      TRANSFERS_DB_OWNER_PASSWORD: ${TRANSFERS_DB_OWNER_PASSWORD:-transfers_owner}
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers_app}
      NOTIFICATION_DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:-notification_owner}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_app}
      CUSTOMER_DB_OWNER_PASSWORD: ${CUSTOMER_DB_OWNER_PASSWORD:-customer_owner}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # App do cliente (etapa 9), a partir de frontend/ (contexto dos workspaces npm). Sobem sempre, sem perfil: o nginx
  # os encontra pelo nome (/bff -> bff:3000, / -> web:80).
  web:
    image: digitalbanking/web:${IMAGE_TAG:-local}
    build:
      context: ../../frontend
      dockerfile: web/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BFF: no local, login pelo mock-oauth2-server (IDENTITY_PROVIDER=local) e cookie sem Secure (a pagina vai por
  # http://127.0.0.1). Os servicos de negocio rodam no host (bootRun ou java -jar), como no nginx; com o perfil apps
  # eles tambem respondem em host.docker.internal pelas portas 8081-8085 publicadas.
  bff:
    image: digitalbanking/bff:${IMAGE_TAG:-local}
    build:
      context: ../../frontend
      dockerfile: bff/Dockerfile
    environment:
      IDENTITY_PROVIDER: local
      COOKIE_SECURE: "false"
      # O recipientToken e um valor aleatorio guardado no Redis (sem chave HMAC nem Secret).
      REDIS_URL: redis://redis:6379
      MOCK_OAUTH2_URL: http://mock-oauth2-server:8080/default
      # Host pedido ao mock: o iss do token sai com ele. Padrao localhost:8090 (servicos em bootRun); o perfil apps e o CI usam mock-oauth2-server:8080.
      MOCK_OAUTH2_HOST: ${MOCK_OAUTH2_HOST:-localhost:8090}
      ACCOUNTS_URL: http://host.docker.internal:8081
      TRANSFERS_URL: http://host.docker.internal:8082
      NOTIFICATION_URL: http://host.docker.internal:8083
      STATEMENT_URL: http://host.docker.internal:8084
      CUSTOMER_URL: http://host.docker.internal:8085
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/bff/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emulador AWS (SNS e SQS), sem persistencia: recriar ou parar perde filas e mensagens.
  # Exige LOCALSTACK_AUTH_TOKEN (conta Hobby gratuita) no .env.
  # Mesma imagem de LocalStackTestSupport.IMAGE (libs/testing-localstack); mude as duas juntas.
  localstack:
    image: localstack/localstack:2026.10.2
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: sns,sqs
      NOTIFICATION_MAX_RECEIVE_COUNT: ${NOTIFICATION_MAX_RECEIVE_COUNT:-5}
      NOTIFICATION_VISIBILITY_TIMEOUT_SECONDS: ${NOTIFICATION_VISIBILITY_TIMEOUT_SECONDS:-30}
      STATEMENT_MAX_RECEIVE_COUNT: ${STATEMENT_MAX_RECEIVE_COUNT:-5}
      STATEMENT_VISIBILITY_TIMEOUT_SECONDS: ${STATEMENT_VISIBILITY_TIMEOUT_SECONDS:-30}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Saudavel so depois que os scripts de init (topico e fila) terminam com sucesso.
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request as r; s = json.load(r.urlopen('http://127.0.0.1:4566/_localstack/init/ready')); exit(0 if s['completed'] and s['scripts'] and all(x['state'] == 'SUCCESSFUL' for x in s['scripts']) else 1)"
      interval: 5s
      timeout: 5s
      retries: 30

  # A imagem roda como dynamodblocal (uid 1000) e um volume nomeado novo nasce do root: este passo, sem rede e so com
  # a capacidade de chown, entrega o diretorio ao usuario da imagem e sai. O banco nao roda como root.
  dynamodb-volume:
    image: amazon/dynamodb-local:3.3.2
    user: root
    entrypoint: ["chown", "dynamodblocal:dynamodblocal", "/data"]
    command: []
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - dynamodb-data:/data

  # Tabela do extrato (statement), em disco no volume dynamodb-data: sobrevive a `down` (sem -v) e a recriacao.
  # Saudavel so com a tabela criada (dynamodb/init/run.sh). A porta so abre no loopback da maquina.
  # Mesma imagem de DynamoDbLocalTestSupport.IMAGE (libs/testing-localstack); mude as duas juntas.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    entrypoint: ["bash", "/opt/statement/run.sh"]
    command: ["-sharedDb", "-dbPath", "/data"]
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb-data:/data
      - ./dynamodb/init:/opt/statement:ro
    depends_on:
      dynamodb-volume:
        condition: service_completed_successfully
    healthcheck:
      # Pergunta em 127.0.0.1 se a tabela existe.
      test: ["CMD", "bash", "/opt/statement/run.sh", "--check"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Emissor OIDC local (no lugar do Cognito). Emissor: http://localhost:8090/default.
  # Tokens configurados em auth/mock-oauth2-config.json e pegos com auth/token.sh.
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5
    environment:
      JSON_CONFIG_PATH: /config/mock-oauth2-config.json
    ports:
      - "${MOCK_OAUTH2_PORT:-8090}:8080"
    volumes:
      - ./auth/mock-oauth2-config.json:/config/mock-oauth2-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/default/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Perfil apps: os cinco servicos pelas imagens (services/<servico>/Dockerfile), no lugar dos processos java -jar.
  # Sobe com: docker compose --env-file infra/local/.env -f infra/local/docker-compose.yml --profile apps up --wait
  # Imagem digitalbanking/<servico>:${IMAGE_TAG:-local}; sem ela, o compose a constroi do bootJar ja gerado pelo Gradle.
  # Entre si e com a infra, os servicos falam pelo nome do servico do compose. As portas 8081-8085 ficam publicadas
  # no host porque o nginx encaminha para host.docker.internal, igual aos processos java -jar.
  # Emissor: http://mock-oauth2-server:8080/default (o iss sai do Host pedido ao mock): tokens pedidos do host
  # vao com MOCK_OAUTH2_HOST=mock-oauth2-server:8080 (auth/token.sh), senao levam 401.
  customer:
    profiles: [apps]
    image: digitalbanking/customer:${IMAGE_TAG:-local}
    build: ../../services/customer
    environment:
      CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/customer
      CUSTOMER_DB_USER: customer_app
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_app}
      CUSTOMER_DB_OWNER_USER: customer_owner
      CUSTOMER_DB_OWNER_PASSWORD: ${CUSTOMER_DB_OWNER_PASSWORD:-customer_owner}
      CUSTOMER_AWS_ENDPOINT: http://localstack:4566
      CUSTOMER_JWT_ISSUER_URI: http://mock-oauth2-server:8080/default
    ports:
      - "8085:8085"
    depends_on: &apps-infra
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_healthy
    healthcheck: &apps-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  accounts:
    profiles: [apps]
    image: digitalbanking/accounts:${IMAGE_TAG:-local}
    build: ../../services/accounts
    environment:
      ACCOUNTS_DB_URL: jdbc:postgresql://postgres:5432/accounts
      ACCOUNTS_DB_USER: accounts_app
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_app}
      ACCOUNTS_DB_OWNER_USER: accounts_owner
      ACCOUNTS_DB_OWNER_PASSWORD: ${ACCOUNTS_DB_OWNER_PASSWORD:-accounts_owner}
      ACCOUNTS_AWS_ENDPOINT: http://localstack:4566
      ACCOUNTS_JWT_ISSUER_URI: http://mock-oauth2-server:8080/default
      ACCOUNTS_OAUTH_TOKEN_URI: http://mock-oauth2-server:8080/default/token
      ACCOUNTS_OAUTH_CLIENT_ID: ${ACCOUNTS_OAUTH_CLIENT_ID:-accounts}
      ACCOUNTS_OAUTH_CLIENT_SECRET: ${ACCOUNTS_OAUTH_CLIENT_SECRET:-local-secret}
      ACCOUNTS_CUSTOMER_BASE_URL: http://customer:8085
      ACCOUNTS_TRANSFERS_BASE_URL: http://transfers:8082
    ports:
      - "8081:8081"
    depends_on: *apps-infra
    healthcheck:
      <<: *apps-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health"]

  transfers:
    profiles: [apps]
    image: digitalbanking/transfers:${IMAGE_TAG:-local}
    build: ../../services/transfers
    environment:
      TRANSFERS_DB_URL: jdbc:postgresql://postgres:5432/transfers
      TRANSFERS_DB_USER: transfers_app
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers_app}
      TRANSFERS_DB_OWNER_USER: transfers_owner
      TRANSFERS_DB_OWNER_PASSWORD: ${TRANSFERS_DB_OWNER_PASSWORD:-transfers_owner}
      TRANSFERS_ACCOUNTS_URL: http://accounts:8081
      TRANSFERS_AWS_ENDPOINT: http://localstack:4566
      TRANSFERS_REDIS_HOST: redis
      TRANSFERS_REDIS_PORT: "6379"
      TRANSFERS_JWT_ISSUER_URI: http://mock-oauth2-server:8080/default
      TRANSFERS_OAUTH_TOKEN_URI: http://mock-oauth2-server:8080/default/token
      TRANSFERS_OAUTH_CLIENT_ID: ${TRANSFERS_OAUTH_CLIENT_ID:-transfers}
      TRANSFERS_OAUTH_CLIENT_SECRET: ${TRANSFERS_OAUTH_CLIENT_SECRET:-local-secret}
      TRANSFERS_CUSTOMER_BASE_URL: http://customer:8085
    ports:
      - "8082:8082"
    depends_on: *apps-infra
    healthcheck:
      <<: *apps-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health"]

  notification:
    profiles: [apps]
    image: digitalbanking/notification:${IMAGE_TAG:-local}
    build: ../../services/notification
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification
      NOTIFICATION_DB_USER: notification_app
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_app}
      NOTIFICATION_DB_OWNER_USER: notification_owner
      NOTIFICATION_DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:-notification_owner}
      NOTIFICATION_AWS_ENDPOINT: http://localstack:4566
      NOTIFICATION_JWT_ISSUER_URI: http://mock-oauth2-server:8080/default
    ports:
      - "8083:8083"
    depends_on: *apps-infra
    healthcheck:
      <<: *apps-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health"]

  statement:
    profiles: [apps]
    image: digitalbanking/statement:${IMAGE_TAG:-local}
    build: ../../services/statement
    environment:
      STATEMENT_AWS_ENDPOINT: http://localstack:4566
      STATEMENT_DYNAMODB_ENDPOINT: http://dynamodb:8000
      STATEMENT_REDIS_HOST: redis
      STATEMENT_REDIS_PORT: "6379"
      STATEMENT_JWT_ISSUER_URI: http://mock-oauth2-server:8080/default
    ports:
      - "8084:8084"
    depends_on:
      <<: *apps-infra
      dynamodb:
        condition: service_healthy
    healthcheck:
      <<: *apps-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health"]

volumes:
  postgres-data:
  dynamodb-data:
