apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "collector.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-http
      port: {{ .Values.port }}
      targetPort: otlp-http
