# nginx do web: arquivos estaticos da SPA React (Vite), com fallback para o index.html.
# Sem root: pid e temporarios em /tmp (no pod, o unico diretorio gravavel).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Arquivos com hash no nome: cache longo. O index.html nunca fica em cache.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
