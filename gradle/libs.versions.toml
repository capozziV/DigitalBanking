[versions]
kotlin = "2.3.21"
spring-boot = "4.1.1"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
archunit = "1.5.1"
junit = "6.0.3"
assertj = "3.27.7"
springdoc = "3.1.1"
java-uuid-generator = "5.2.0"
aws-sdk = "2.57.1"
spring-cloud-aws = "4.2.1"
# Consumer-driven contracts (ADR 0022): successor of Spring Cloud Contract, built on Spring Boot 4.1.
stubborn-contract = "0.2.2"
# Logback appender of OpenTelemetry (logs by OTLP). Not managed by Spring Boot: 2.28.x is the line built on the
# OpenTelemetry API 1.62.0 of Spring Boot 4.1.1; bump it together with Spring Boot.
opentelemetry-instrumentation-alpha = "2.28.1-alpha"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sdk-dynamodb = { module = "software.amazon.awssdk:dynamodb" }
aws-sdk-sns = { module = "software.amazon.awssdk:sns" }
aws-sdk-sqs = { module = "software.amazon.awssdk:sqs" }
# Spring Cloud AWS BOM (starters have no version). Import aws-sdk-bom next to it: Gradle picks the higher SDK version,
# so the project's aws-sdk wins over the one the Spring Cloud AWS BOM brings.
spring-cloud-aws-bom = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "spring-cloud-aws" }
spring-cloud-aws-starter-sqs = { module = "io.awspring.cloud:spring-cloud-aws-starter-sqs" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-instrumentation-alpha" }
stubborn-contract-bom = { module = "sh.stubborn:stubborn-contract-dependencies", version.ref = "stubborn-contract" }

# Dependencias de plugin para o build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
stubborn-contract-gradle-plugin = { module = "sh.stubborn:stubborn-contract-gradle-plugin", version.ref = "stubborn-contract" }
